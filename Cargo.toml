[package]
name = "nemo-files"
version = "3.2.0"
edition = "2021"
description = "File manager for Wayland and the file dialog of every app"
license = "MIT"
publish = false

[[bin]]
name = "nemo-files"
path = "src/main.rs"

[dependencies]
nemo-px = { git = "https://github.com/HamzaAkramv15/nemo", tag = "px-v3.2.1", features = ["tiny5"] }
smithay-client-toolkit = "0.20"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
calloop-wayland-source = "0.4"
calloop = "0.14"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
# blocking 1.7 keeps idle pool threads forever, each waking twice a second (zbus closes sockets
# and reads peer credentials there); 1.6 lets them exit after 500 ms idle
blocking = "=1.6.2"
libc = "0.2"

[workspace]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind"
